    <!-- 游戏启动剧情场景 -->
    <div id="story-scene" style="display: none;">
        <div id="story-content">
            <p id="story-text"></p>
        </div>
    </div>
    
    <div id="game-container">
        <h1>赤石跑酷游戏</h1>
        <div id="game-info">
            <div id="score">得分: 0</div>
            <div id="distance">路程: 0</div>
            <div id="diamonds">钻石: 0</div>
            <div id="scene">场景: 草原</div>
            <div id="difficulty">难度: 简单</div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div id="controls">
            <button onclick="gameStart()">开始游戏</button>
            <button onclick="pauseGame()">暂停游戏</button>
            <button onclick="resetGame()">重置游戏</button>
            <button onclick="returnToTitle()">返回标题</button>
        </div>
        <div id="instructions">
            控制: 方向键 ↑↓→ 移动角色 | 收集赤石 | 随着时间难度增加
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        // 页面加载完成后初始化游戏
        window.onload = function() {
            initGame();
        };
        
        // 开始游戏，先隐藏游戏须知，进入故事场景
        function startGame() {
            document.getElementById('game-notice').style.display = 'none';
            showStoryScenes();
        }
        
        // 显示故事场景
        function showStoryScenes() {
            const storyScene = document.getElementById('story-scene');
            const storyText = document.getElementById('story-text');
            
            // 故事场景数组
            const scenes = [
                { background: 'p2.png', text: '我从那门中逃出去后' },
                { background: 'back.png', text: '我莫名其妙掉进了一个神秘空间' },
                { background: 'back.png', text: '周围的一切，包括我的样貌，都发生了神奇的变化' },
                { background: 'back.png', text: '我听见渺远的声音' },
                { background: 'back.png', text: '你已进入赤石幻境，手捧赤石来见我吧' }
            ];
            
            let currentScene = 0;
            
            // 显示第一个场景
            function showNextScene() {
                if (currentScene < scenes.length) {
                    const scene = scenes[currentScene];
                    
                    // 设置背景
                    storyScene.style.backgroundImage = `url('${scene.background}')`;
                    storyScene.style.backgroundSize = 'cover';
                    storyScene.style.backgroundPosition = 'center';
                    storyScene.style.backgroundRepeat = 'no-repeat';
                    
                    // 显示场景
                    storyScene.style.display = 'flex';
                    
                    // 重置文本动画
                    storyText.style.animation = 'none';
                    storyText.offsetHeight; // 触发重排
                    storyText.style.animation = 'fadeIn 2s forwards';
                    
                    // 设置文本
                    storyText.textContent = scene.text;
                    
                    // 延迟后显示下一个场景
                    setTimeout(() => {
                        // 添加淡出效果
                        storyText.classList.add('fade-out');
                        
                        // 淡出完成后继续
                        setTimeout(() => {
                            storyText.classList.remove('fade-out');
                            currentScene++;
                            showNextScene();
                        }, 1000);
                    }, 3000); // 每个场景显示3秒
                } else {
                    // 故事场景结束，进入游戏
                    storyScene.style.display = 'none';
                    document.getElementById('game-container').style.display = 'block';
                    // 调用游戏中的startGame函数
                    window.gameStart();
                }
            }
            
            // 开始显示场景
            showNextScene();
        }
        
        // 结束游戏，关闭窗口
        function exitGame() {
            window.close();
        }
        
        // 返回标题界面
        function returnToTitle() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('game-notice').style.display = 'flex';
            // 调用游戏中的resetGame函数，确保游戏状态被重置
            if (typeof resetGame === 'function') {
                resetGame();
            }
        }
    </script>
